    /* Styled visual page grid block background */

                        linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
    }
    
    /* Elegant smooth animations */
    .slide-fade-in {
      animation: slideFadeIn 0.35s ease-out forwards;
    }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Falling rose petals style */
    @keyframes fall {
      0% {
        top: -40px;
        transform: translateX(0) rotate(0deg);
      }
      50% {
        transform: translateX(50px) rotate(180deg);
      }
      100% {
        top: 100vh;
        transform: translateX(-50px) rotate(360deg);
        opacity: 0;
      }
    }
    .petal {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: fall 4s linear infinite;
      z-index: 50;
    }

    /* Print styling to strip down UI controls on printing the certificate */
    @media print {

        background-color: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;

      #slide-container {

        padding: 0 !important;
      }
      #slide-rose-ceremony {

              <!-- Defensive action strategy green box -->

    window.selectRisk = (riskId) => {

    // Slide 5: Date Product Configurator / Date Planner
    const getSlideFiveHTML = () => {
      const currentPkg = getActivePackage();
      const possibleAddOns = addOnsMeta();

      // Top Packages clickable Cards list
      let packageListMarkup = '';
      packages.forEach(pkg => {
        const isSelected = pkg.id === state.selectedPackageId;
        const badgeLabel = pkg.id === 'bachelor' ? 'TOP ROMANCE' : pkg.id === 'business' ? 'EXECUTIVE' : 'STARTUP';
        packageListMarkup += `
          <div onclick="selectPackageId('${pkg.id}')" class="p-4 rounded-3xl border transition-all cursor-pointer flex flex-col justify-between space-y-2 select-none ${
            isSelected ? 'bg-rose-50/70 border-rose-400 shadow-sm' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
          }">
            <div class="space-y-1">
              <span class="px-2 py-0.5 rounded-full text-[8px] font-mono uppercase font-black ${
                isSelected ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-600'

                ${badgeLabel}
              </span>
              <h4 class="font-extrabold text-slate-900 text-xs uppercase tracking-tight mt-1 leading-tight">

              </h4>
              <p class="text-[10px] text-rose-600 font-mono italic leading-none">
                ${pkg.tagline}
              </p>
            </div>
          </div>
        `;
      });

      // Highlights bullet points
      let bulletMarkup = '';
      currentPkg.highlights.forEach(hl => {
        bulletMarkup += `
          <li class="flex items-start gap-2 text-xs text-slate-600 font-sans">
            <span class="text-emerald-600 font-black mt-0.5">✔</span>
            <span>${hl}</span>
          </li>
        `;
      });

      // Add-ons list checkboxes markup
      let addOnListMarkup = '';
      possibleAddOns.forEach(addon => {
        const isChecked = state.addOns.includes(addon.id);
        addOnListMarkup += `
          <div onclick="toggleAddOn('${addon.id}')" class="p-2.5 rounded-2xl border transition-all duration-200 cursor-pointer flex items-start gap-2.5 select-none ${
            isChecked ? 'bg-rose-50/50 border-rose-300 text-rose-900' : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-slate-300'
          }">
            <div class="mt-0.5 shrink-0">
              ${isChecked ? 
                `<span class="text-sm text-rose-600 font-black">☑</span>` : 
                `<span class="text-sm text-slate-400 font-mono">☐</span>`}
            </div>
            <div class="space-y-1 text-left">
              <div class="text-[11px] font-extrabold font-sans leading-tight leading-snug">${addon.label}</div>
              <div class="text-[9px] font-mono leading-none font-bold text-emerald-600">${addon.bonus}</div>
            </div>
          </div>
        `;
      });

      return `
        <div class="space-y-6">
          <div class="space-y-1">
            <h2 class="text-xs font-mono tracking-widest text-rose-600 uppercase flex items-center gap-2 font-black">
              ⚙️ INHALTE & OPTIONALE LEISTUNGEN
            </h2>
            <h3 class="text-2xl md:text-3xl font-black text-slate-900 uppercase tracking-tight">
              Wählen Sie Ihr <span class="text-rose-600 italic font-serif font-medium normal-case">Date-Paket</span>
            </h3>
          </div>

          <p class="text-sm text-slate-600 leading-relaxed font-sans">
            Zur Risikominimierung ist das Treffen modular anpassbar. Wählen Sie eins unserer vordefinierten Basispreis-Szenarien und verfeinern Sie das Erlebnis mit anwendbaren Upgrades (SLAs):
          </p>

          <!-- Grid of packages -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            ${packageListMarkup}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pt-1">
            
            <!-- Left core overview -->
            <div class="lg:col-span-7 bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">
              <div>
                <span class="text-[9px] font-mono font-extrabold text-slate-400 block mb-0.5 uppercase tracking-wider">
                  Leistungsbeschreibung
                </span>
                <h4 class="text-base font-black text-slate-900 uppercase tracking-tight">${currentPkg.title}</h4>
              </div>

              <ul class="space-y-2">
                ${bulletMarkup}
              </ul>

              <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-100 text-[10px] font-mono">

                  <span class="text-slate-400 block uppercase tracking-wider text-[8px] font-bold">Atmosphäre</span>
                  <span class="text-slate-800 font-bold leading-normal block">${currentPkg.atmosphere}</span>

                  <span class="text-emerald-700 font-extrabold block text-xs mt-0.5">${currentPkg.costEstimate}</span>
                </div>
              </div>
            </div>

            <!-- Right Addon config -->
            <div class="lg:col-span-5 bg-white border border-slate-200 rounded-3xl p-5 flex flex-col justify-between space-y-4 shadow-sm">
              <div class="space-y-1 text-left">
                <h4 class="text-xs font-mono font-extrabold text-slate-500 uppercase tracking-widest">
                  PORTFOLIO UPGRADES (OPTIONAL):
                </h4>
                <p class="text-[10px] text-slate-500 font-sans">
                  Personalisieren Sie das Service-Level-Agreement für maximalen Erfolg:
                </p>
              </div>

              <div class="grid grid-cols-1 gap-2 pt-1">
                ${addOnListMarkup}

            </div>

      `;
    };

    window.selectPackageId = (id) => {
      state.selectedPackageId = id;
      renderActiveSlide();

    window.toggleAddOn = (addonId) => {
      const idx = state.addOns.indexOf(addonId);
      if (idx > -1) {
        state.addOns.splice(idx, 1);

        return `

              <div class="absolute top-0 right-0 bg-rose-100 p-1.5 rounded-full text-rose-700 border border-rose-200 animate-bounce">

              </div>
            </div>

            <!-- Validation accept trigger button -->
            <div class="pt-2 w-full">
              <button onclick="acceptRoseAction()" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-rose-600 to-rose-550 text-white font-sans font-black tracking-wide text-sm md:text-base rounded-2xl shadow-md hover:from-rose-500 hover:to-rose-600 transition-all duration-300 transform active:scale-95 cursor-pointer">
                JA, ICH NEHME DIE ROSE AN! 👍
              </button>
              <p class="text-[10px] text-slate-500 font-mono mt-3">
                Zertifizierter Klick. Durch die Annahme wird <span class="valColleague">Sara</span> zur offiziellen Zeugen-Kollegin ernannt.

            </div>

        `;
      } else {

        return `
          <div class="w-full max-w-2xl mx-auto relative text-left py-2">
            
            <div class="bg-white border border-slate-200 rounded-3xl p-5 md:p-8 space-y-6 relative text-slate-800 shadow-sm">
              <!-- Physical Stamp effect -->
              <div class="absolute right-4 top-4 md:right-8 md:top-8 rotate-12 border-4 border-emerald-600 text-emerald-600 font-mono px-3.5 py-1 font-black text-[10px] uppercase rounded-full tracking-wider bg-emerald-50 select-none no-print">
                ✔ COMPLIANCE FREIGEGEBEN
              </div>

              <!-- Header parameters -->
              <div class="flex items-center gap-2">
                <span class="bg-rose-600 text-white px-2.5 py-0.5 rounded-full text-[9px] font-mono font-bold uppercase tracking-widest">
                  LETZTES STATEMENT
                </span>
                <span class="text-slate-500 font-mono text-[10px] font-bold">Vertragsnummer: LOI-ELVIRA-01</span>
              </div>

              <!-- Contract Title -->
              <div class="space-y-1">
                <h3 class="text-xl md:text-2xl font-black text-slate-900 uppercase tracking-tight">
                  Letter Of Intent (Absichtserklärung)
                </h3>
                <p class="text-slate-500 font-sans text-xs">
                  Vereinbart am heutigen Tag für das anstehende Rekrutierungsverfahren.
                </p>
              </div>

              <!-- Paragraph clauses with core variables bound -->
              <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3 text-xs text-slate-700 leading-relaxed font-semibold">
                <p>
                  <strong>§ 1 Geltungsbereich:</strong> Elvira akzeptiert hiermit die rote Rose des Bewerbers <strong class="valCandidate">Maximilian</strong> und signalisiert die Absicht, ein Kennenlern-Meeting im Format <em>${currentPkg.title}</em> zu vereinbaren.
                </p>
                <p>
                  <strong>§ 2 Begleitende Services (SLAs):</strong> Folgende exklusive Upgrades wurden dem Portfolio beigefügt: <span class="text-rose-600 font-extrabold font-mono">${state.addOns.length} Upgrade(s)</span>.

                <p>
                  <strong>§ 3 Ausschluss von Spionage-Missionen:</strong> Die anbahnende Arbeitskollegin <strong class="valColleague">Sara</strong> wird zu absolutem Stillschweigen verdammt. Jede unerwünschte WhatsApp-Intervention beim Date wird mit einer Kaffeerunde bestraft.
                </p>
                <p>
                  <strong>§ 4 Gültigkeitsdauer:</strong> Diese Urkunde gilt bis zum Servieren der Vorspeise und kann jederzeit mit ausgiebigen Lachkrämpfen verlängert werden.
                </p>
              </div>

              <!-- Dynamic signature inputs -->
              <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-200">
                <div class="space-y-2">
                  <span class="text-[9px] text-slate-400 font-mono uppercase tracking-wider block font-bold">Unterschrift Bewerber</span>
                  <div class="h-10 border-b border-rose-300 font-serif text-rose-600 text-center italic text-base select-none flex items-end justify-center pb-1 font-bold valCandidate">
                    Maximilian
                  </div>
                </div>

                <div class="space-y-2 no-print">
                  <span class="text-[9px] text-slate-400 font-mono uppercase tracking-wider block font-bold">Ihre digitale Signatur</span>
                  <input id="signatureInput" type="text" value="${state.signatureText}" placeholder="Hier Namen eingeben..." oninput="updateSignature(this)" class="w-full bg-slate-50 border-b border-rose-300 focus:outline-none focus:border-rose-500 text-slate-900 text-xs font-serif italic text-center py-2 placeholder:text-slate-400 rounded-t-xl" style="height:40px;">
                </div>
                
                <!-- Print replacement for signature in printing mode -->
                <div class="space-y-2 hidden print:block">
                  <span class="text-[9px] text-slate-400 font-mono uppercase tracking-wider block font-bold">Ihre digitale Signatur</span>
                  <div class="h-10 border-b border-slate-300 font-serif text-slate-900 text-center italic text-base flex items-end justify-center pb-1">
                    ${state.signatureText || 'Elvira (Digital signiert)'}
                  </div>
                </div>
              </div>

              <!-- Print controls and Email alerts -->
              <div class="space-y-3 pt-2 text-center no-print">
                <div class="flex justify-center items-center gap-1.5 text-rose-700 font-bold italic text-xs">
                  💖 Glückwunsch! Das Date wurde erfolgreich projektiert.
                </div>
                
                <!-- Quick social buttons grid -->
                <div class="flex flex-wrap items-center justify-center gap-2.5">
                  <button onclick="window.print()" class="px-4 py-2 bg-slate-900 text-white text-[11px] font-mono rounded-2xl hover:bg-slate-800 font-bold flex items-center gap-1.5 transition-all">
                    🖨️ DOKUMENT DRUCKEN / SCREENSHOT
                  </button>
                  <button onclick="sendMailToColleague()" class="px-4 py-2 bg-rose-100 text-rose-700 text-[11px] font-mono rounded-2xl hover:bg-rose-200 font-bold border border-rose-250 flex items-center gap-1.5 transition-all">
                    📧 KOLLEGIN ${state.colleagueName.toUpperCase()} INFORMIEREN
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    };

    window.updateSignature = (el) => {
      state.signatureText = el.value;
    };

    // Mail composer trigger
    window.sendMailToColleague = () => {
      const email = `${state.colleagueName.toLowerCase()}@firma.com`;
      const subject = encodeURIComponent(`Ich habe die Rose angenommen! 🌹`);
      const body = encodeURIComponent(`Hallo ${state.colleagueName},\n\nich habe gerade das Date-Dossier und die wunderbare Rose von ${state.candidateName} angenommen.\n\nBitte plane keine geheimen Spionage-Aktivitäten oder WhatsApp-Interferenzen an unserem Date-Abend. Unser Meeting ist compliance-technisch bereits freigegeben!\n\nLiebe Grüße!`);
      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    };

    // Transition of accepting the rose and raining particles
    window.acceptRoseAction = () => {
      state.roseAccepted = true;
      renderActiveSlide();

      // Raining red rose particles
      const container = document.getElementById('petal-container');
      container.innerHTML = '';
      
      for(let i=0; i<35; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.textContent = '🌹';
        petal.style.left = `${Math.random() * 100}vw`;
        petal.style.animationDelay = `${Math.random() * 2}s`;
        petal.style.transform = `scale(${Math.random() * 0.8 + 0.4})`;
        container.appendChild(petal);
      }

      // Cleanup generated petals eventually
      setTimeout(() => {
        container.innerHTML = '';
      }, 7000);
    };

  </script>
</body>
